syntax = "proto3";
option optimize_for = LITE_RUNTIME;
package edge_dlis_tokenizers.proto;

// Field numbers and types preserve the existing DLIS BERT vocabulary wire
// format.
message BertVocabulary {
  repeated string words = 1;
}
