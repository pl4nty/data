name: main

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Azure and Claude auth
    environment: dev
    strategy:
      matrix:
        cmd:
          - android_bulletins_parser.py
          - get.py
          - powershell_gallery.py
          - microsoft_3rdpartysource.py
          - microsoft_download_center.py
          - uupdump.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5.4.0
        with:
          python-version: 3.x
          cache: pip
      # azure-identity doesn't support GitHub WIF
      - uses: azure/login@v2.2.0
        with:
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          allow-no-subscriptions: true
      - run: pip install -r requirements.txt

      - run: python -u ${{ matrix.cmd }}
        env:
          AZURE_STORAGE_IN: ${{ secrets.AZURE_STORAGE_IN }}
          AZURE_STORAGE_OUT: ${{ secrets.AZURE_STORAGE_OUT }}

      - id: summary
        # push runs keep the static message
        if: github.event_name != 'push'
        uses: ./.github/actions/claude-commit-message
        with:
          model: ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      - uses: EndBug/add-and-commit@v9.1.4
        with:
          default_author: github_actions
          message: "data(${{ matrix.cmd }}): ${{ steps.summary.outputs.message || 'change detected' }}"
          pull: "--rebase --autostash"

  windows:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write # Claude auth
    environment: dev
    strategy:
      matrix:
        cmd:
          - microsoft_defender_signatures.ps1
    steps:
      - uses: actions/checkout@v4
      - run: .\${{ matrix.cmd }}

      - id: summary
        # push runs keep the static message
        if: github.event_name != 'push'
        uses: ./.github/actions/claude-commit-message
        with:
          model: ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      - uses: EndBug/add-and-commit@v9.1.4
        with:
          default_author: github_actions
          message: "data(${{ matrix.cmd }}): ${{ steps.summary.outputs.message || 'change detected' }}"
          pull: "--rebase --autostash"
