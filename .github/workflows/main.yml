name: main

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      cmd:
        description: Run only this script (default runs all)
        required: false
  schedule:
    - cron: '0 */6 * * *'

jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: dev
    strategy:
      fail-fast: false
      matrix:
        cmd:
          - android_bulletins_parser.py
          - get.py
          - powershell_gallery.py
          - microsoft_3rdpartysource.py
          - microsoft_download_center.py
          - uupdump.py
          - windows_ddf.py
          - windows_safeguard_holds.py
    steps:
      - uses: actions/checkout@v4
        if: ${{ !inputs.cmd || inputs.cmd == matrix.cmd }}
      - uses: actions/setup-python@v5.4.0
        if: ${{ !inputs.cmd || inputs.cmd == matrix.cmd }}
        with:
          python-version: 3.x
          cache: pip
      # azure-identity doesn't support GitHub WIF
      - uses: azure/login@v2.2.0
        if: ${{ !inputs.cmd || inputs.cmd == matrix.cmd }}
        with:
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          allow-no-subscriptions: true
      - run: pip install -r requirements.txt
        if: ${{ !inputs.cmd || inputs.cmd == matrix.cmd }}

      - run: python -u ${{ matrix.cmd }}
        if: ${{ !inputs.cmd || inputs.cmd == matrix.cmd }}
        env:
          AZURE_STORAGE_IN: ${{ secrets.AZURE_STORAGE_IN }}
          AZURE_STORAGE_OUT: ${{ secrets.AZURE_STORAGE_OUT }}

      - uses: EndBug/add-and-commit@v9.1.4
        if: ${{ !inputs.cmd || inputs.cmd == matrix.cmd }}
        with:
          default_author: github_actions
          message: "data(${{ matrix.cmd }}): change detected"
          pull: "--rebase --autostash"

  defender:
    if: ${{ !inputs.cmd || inputs.cmd == 'microsoft_defender_signatures.py' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: dev
    env:
      UNLUAC_RS_REV: 76d1452359b207c2a6fdec3c7c894152c7a61374 # v1.4.5
    strategy:
      matrix:
        cmd:
          - microsoft_defender_signatures.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5.4.0
        with:
          python-version: 3.x
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.1 p7zip-full
      - uses: actions/cache@v4
        id: unluac-rs
        with:
          path: ~/.cargo/bin/unluac-cli
          key: unluac-rs-${{ env.UNLUAC_RS_REV }}-${{ runner.os }}-${{ runner.arch }}
      - if: steps.unluac-rs.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install --locked --git https://github.com/x3zvawq/unluac-rs --rev "$UNLUAC_RS_REV" unluac-cli
      - run: python -u ${{ matrix.cmd }}

      - uses: EndBug/add-and-commit@v9.1.4
        with:
          default_author: github_actions
          message: "data(${{ matrix.cmd }}): change detected"
          pull: "--rebase --autostash"
